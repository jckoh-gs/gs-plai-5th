apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grid-data, namespace: gs-plai-5h}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grid-mqtt-data, namespace: gs-plai-5h}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grid, namespace: gs-plai-5h}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: grid}}
  template:
    metadata: {labels: {app: grid}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: charleskoh-nucbox-g3}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrate-mqtt-storage
          image: MQTT_IMAGE
          command: [sh, -c, 'if [ ! -e /broker/.migration-complete ]; then if [ -f /legacy/mosquitto.db ] && [ ! -e /broker/mosquitto.db ]; then cp /legacy/mosquitto.db /broker/mosquitto.db; fi; touch /broker/.migration-complete; fi']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 8Mi}, limits: {cpu: 100m, memory: 32Mi}}
          volumeMounts:
            - {name: data, mountPath: /legacy, readOnly: true}
            - {name: mqtt-data, mountPath: /broker}
      containers:
        - name: app
          image: GRID_IMAGE
          ports: [{containerPort: 3001}]
          env:
            - {name: MQTT_URL, value: 'mqtt://127.0.0.1:1883'}
            - {name: MQTT_USERNAME, value: grid}
            - name: MQTT_PASSWORD
              valueFrom: {secretKeyRef: {name: grid-secrets, key: mqtt-password}}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: grid-secrets, key: api-token}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /api/health, port: 3001}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 3001}, initialDelaySeconds: 30, periodSeconds: 15}
        - name: mqtt
          image: MQTT_IMAGE
          command: [sh, -c, 'cp /mosquitto/secrets/passwords /run/mosquitto/passwords && cp /mosquitto/config/acl /run/mosquitto/acl && chmod 600 /run/mosquitto/passwords /run/mosquitto/acl && exec mosquitto -c /mosquitto/config/mosquitto.conf']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: '1', memory: 128Mi}}
          volumeMounts:
            - {name: mqtt-runtime, mountPath: /run/mosquitto}
            - {name: mqtt-config, mountPath: /mosquitto/config}
            - {name: secrets, mountPath: /mosquitto/secrets, readOnly: true}
            - {name: mqtt-data, mountPath: /mosquitto/data}
          readinessProbe: {tcpSocket: {port: 1883}, initialDelaySeconds: 3, periodSeconds: 5}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grid-data}}
        - {name: mqtt-data, persistentVolumeClaim: {claimName: grid-mqtt-data}}
        - {name: mqtt-config, configMap: {name: grid-mqtt}}
        - {name: mqtt-runtime, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: secrets, secret: {secretName: grid-secrets, defaultMode: 288, items: [{key: passwords, path: passwords}]}}
---
apiVersion: v1
kind: Service
metadata: {name: grid, namespace: gs-plai-5h}
spec:
  selector: {app: grid}
  ports: [{name: http, port: 3001, targetPort: 3001}]
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grid-private, namespace: gs-plai-5h}
spec:
  podSelector: {matchLabels: {app: grid}}
  policyTypes: [Ingress]
  ingress: []
