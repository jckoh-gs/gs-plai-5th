apiVersion: v1
kind: Namespace
metadata:
  name: gs-plai-5h
  labels:
    app.kubernetes.io/part-of: grid-vpp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grid-registry
  namespace: gs-plai-5h
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-registry
  namespace: gs-plai-5h
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grid-registry
  template:
    metadata:
      labels:
        app: grid-registry
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: charleskoh-nucbox-g3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "127.0.0.1:15050"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, "http://127.0.0.1:15050/v2/"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grid-registry
