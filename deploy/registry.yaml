apiVersion: v1
kind: Namespace
metadata:
  name: gs-plai-5h
  labels:
    app.kubernetes.io/part-of: grid-vpp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grid-registry
  namespace: gs-plai-5h
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-registry
  namespace: gs-plai-5h
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grid-registry
  template:
    metadata:
      labels:
        app: grid-registry
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: charleskoh-nucbox-g3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: 127.0.0.1:15050/grid-registry@sha256:404bd3e27cc5923825c1f47236459f5feff627711fafb00c739c9c2c15f9b56c
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "127.0.0.1:15050"
            - name: OTEL_TRACES_EXPORTER
              value: none
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            exec:
              command: [/healthcheck]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grid-registry
